name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint, Build, Test (Puppet ${{ matrix.puppet }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ruby as on the devices
          - puppet: '7'
            ruby: '3.1.5'
          # Ruby shipped with the puppet-agent 8 package
          - puppet: '8'
            ruby: '3.2'
    env:
      PUPPET_GEM_VERSION: '~> ${{ matrix.puppet }}.0'
      PUPPET_VERSION: ${{ matrix.puppet }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system packages (Dockerfile parity)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install uv (Dockerfile parity)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Ruby tooling (Dockerfile parity)
        run: |
          gem install puppet --version "$PUPPET_GEM_VERSION"
          gem install puppet-lint
          gem install puppetlabs_spec_helper
          gem install metadata-json-lint
          gem install yaml-lint
          gem install hiera-eyaml
          gem install r10k
          gem install pdk

      - name: Install bundle dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run pre-commit (all files)
        run: uvx pre-commit run --all-files

      - name: Run linters
        run: |
          make lint validate

      - name: Build module
        run: pdk build --force

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.xml
          flags: puppet${{ matrix.puppet }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-package-puppet${{ matrix.puppet }}
          path: pkg/*.tar.gz
          if-no-files-found: ignore
